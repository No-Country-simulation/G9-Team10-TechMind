# =========================
# Configuración de tests
# Sobreescribe application.properties principal para evitar
# dependencia de variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
# =========================

# Base de datos H2 en memoria — no requiere MySQL local
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA — crear y destruir el schema automáticamente en cada test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway — desactivado en tests (ddl-auto=create-drop se encarga del schema)
spring.flyway.enabled=false

# AI Microservice — URL dummy, AiClient se mockea en los tests
ai.api.url=http://localhost:9999
